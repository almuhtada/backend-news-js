# Definisikan zone limit request untuk menahan DDoS/Spam API (Taruh di /etc/nginx/nginx.conf jika error)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.almuhtada.org;

    client_max_body_size 6M;

    # Cegah serangan brute force / spam API dengan membatasi request per IP
    # limit_req zone=api_limit burst=20 nodelay;

    # Folder static upload: Hanya izinkan gambar statis, blokir eksekusi script / HTML (XSS/Malware)
    location /uploads/ {
        alias /var/www/almuhtada/backend-news-js/uploads/;
        
        # Hanya izinkan format file gambar/avatar yang aman
        location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            # Sandbox & CSP untuk mencegah browser mengeksekusi script jika ada malware yang diselipkan di gambar
            add_header Content-Security-Policy "default-src 'none'; sandbox";
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "DENY";
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Blokir file lainnya (termasuk .html, .php, .js, .sh, .exe, dsb) secara total
        location ~* \.(.*)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
